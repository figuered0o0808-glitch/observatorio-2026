# Coleta da única pesquisa nominal de deputado registrada no TSE que o RJ tem em 2026.
#
# Roda só quando alguém pede (workflow_dispatch): do contêiner do Claude o domínio do jornal
# responde bloqueado no proxy de saída, e do runner responde, a mesma razão de a coleta da
# Wikipédia morar aqui.
#
# O resultado é PROPOSTA, não dado publicado: sai em dados/rjsp/_pesquisa-deputados-rj.csv,
# com o HTML bruto ao lado para auditoria, e cada nome resolvido contra a candidatura
# registrada por id_tse. Nada entra no mural antes de alguém olhar a coluna "conferir".
name: Pesquisa de deputados (RJ)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pesquisa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ler a pesquisa de lembrança (Prefab) e resolver cada nome citado
        run: python3 coleta/pesquisa_deputados_rj.py | tee /tmp/saida.txt

      # A série do Vetor Arrow é a que traz percentual e várias rodadas. Roda mesmo se a
      # anterior falhar: são pesquisas independentes e uma não deve derrubar a outra.
      - name: Ler a série com percentual (Vetor Arrow / Agenda do Poder)
        if: always()
        run: python3 coleta/pesquisa_deputados_serie.py | tee /tmp/serie.txt

      # if: always() porque o valor desta coleta está tanto no que ela extrai quanto no HTML
      # bruto: a primeira rodada morreu sem commitar o bruto e não houve como saber por quê.
      - name: Commitar a proposta e o bruto
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/rjsp/_pesquisa-deputados-rj.csv dados/rjsp/_pesquisa-deputados-rj.html \
                  dados/rjsp/_serie-deputados-rj.csv dados/rjsp/_serie-deputados-rj.html
          # --cached, e não git diff: na primeira rodada os arquivos são novos, e para o git
          # arquivo que ainda não existe não tem diferença nenhuma
          if git diff --cached --quiet; then
            echo "nada mudou na proposta"
            exit 0
          fi
          resumo=$(tail -8 /tmp/serie.txt 2>/dev/null | head -1)
          git commit -m "Proposta: pesquisa Prefab/Diário do Rio de deputado no RJ

          $resumo

          Medida é pertencimento ao conjunto dos mais citados espontaneamente, não
          percentual: a pesquisa publica os nomes em ordem alfabética, sem número e sem
          classificação. Nenhum nome entra no mural antes da conferência."
          git push
