# Publica o Mural dos Candidatos no GitHub Pages a cada push na main.
#
# O passo configure-pages com enablement liga o Pages sozinho na primeira
# execução, então não é preciso mexer em Settings.
#
# Só o index.html vai para o site: o mural é autocontido, uma página só, e
# não depende de nenhum outro arquivo do repositório. Os CSVs continuam
# versionados e visíveis aqui no GitHub, mas ficam fora do artefato do
# Pages, que assim pesa 2 MB em vez de 43 MB a cada publicação.
name: Publicar o mural

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Separar o que vai para o site
        run: |
          mkdir -p site
          cp index.html site/index.html
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publicacao
        uses: actions/deploy-pages@v4
