# Fotos dos presidenciáveis pela Wikimedia Commons, com autor e licença (coleta/fotos_presidenciaveis.py).
# Roda sob demanda: foto de candidato muda pouco, e cada troca merece ser vista antes de publicar.
name: Fotos dos presidenciáveis

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-main
  cancel-in-progress: false

jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Coletar as fotos
        run: python3 coleta/fotos_presidenciaveis.py
      - name: Gravar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mural/fotos dados/fotos-presidenciaveis.csv
          if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
          git commit -m "Fotos dos presidenciáveis pela Wikimedia Commons, com autor e licença"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
