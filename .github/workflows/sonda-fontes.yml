# Sonda temporária de fontes (7/9/2026). Mede o que TSE, Google Trends, Instagram e
# alternativas respondem de dentro de um runner do GitHub, para decidir o que dá para
# automatizar. Não grava nada em dados/. Sai do repositório depois do diagnóstico.
name: Sondar as fontes

on:
  workflow_dispatch:

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sonda
        run: python3 coleta/_sonda_fontes.py

      - name: Coletor do Google Trends em ensaio
        run: python3 coleta/google_trends.py --dry-run
