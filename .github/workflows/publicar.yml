# Publica o Mural dos Candidatos no GitHub Pages a cada push na main.
#
# O Pages deste repositório está no modo "GitHub Actions" (não "deploy from a
# branch"), então é este workflow que publica; um push sozinho não publica
# nada. O artefato leva só o que o site serve: o index.html (autocontido) e o
# cartão de prévia de link. Os CSVs e o restante do projeto continuam
# versionados aqui, mas fora do site.
#
# O workflow de atualização automática (atualizar.yml) reaproveita este mesmo
# passo de publicação no fim da própria execução.
name: Publicar o mural

on:
  push:
    branches: [main]
    paths:
      - index.html
      - mural/logo/mural-og-1200x630.png
      - .github/workflows/publicar.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # A página é regerada aqui, e não usada como está no repositório, porque as chaves da
      # conta vivem nos segredos. O index.html versionado sai sem chave (mural aberto), e é
      # esta geração que produz a versão com a trava. Chave anon é pública por definição.
      - name: Gerar a página com as chaves da conta
        env:
          MURAL_SUPABASE_URL: ${{ secrets.MURAL_SUPABASE_URL }}
          MURAL_SUPABASE_ANON: ${{ secrets.MURAL_SUPABASE_ANON }}
          MURAL_CARGA_URL: ${{ secrets.MURAL_CARGA_URL }}
        run: python3 mural/_gerar_mural.py
      - name: Separar o que o site serve
        run: |
          mkdir -p site/mural/logo
          cp index.html site/index.html
          cp mural/logo/mural-og-1200x630.png site/mural/logo/
          # a carga protegida só entra no site enquanto o bucket privado do Supabase não estiver
          # configurado; com MURAL_CARGA_URL apontando para storage:, ela deixa de ser servida aqui
          if [ -z "${{ secrets.MURAL_CARGA_URL }}" ]; then cp mural-completo.json site/; fi
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: publicacao
        uses: actions/deploy-pages@v4
