# Sonda a API DivulgaCandContas do TSE a partir do runner (o ambiente de trabalho não a alcança):
# mostra os campos de situação de cada candidatura presidencial, para o coletor usar o formato real.
name: Sondar TSE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler as candidaturas
        run: |
          python3 - <<'PY'
          import csv, io, json, urllib.request
          rows = list(csv.DictReader(io.open("dados/candidatos.csv", encoding="utf-8-sig")))
          for i, r in enumerate(rows):
              try:
                  req = urllib.request.Request(r["url_tse"], headers={"User-Agent": "Mozilla/5.0 (observatorio-2026)"})
                  d = json.load(urllib.request.urlopen(req, timeout=30))
              except Exception as e:
                  print(r["candidato"], "ERRO", e); continue
              if i == 0:
                  print("CHAVES:", sorted(d.keys()))
              sel = {k: v for k, v in d.items() if any(s in k.lower() for s in ("situacao", "totaliza", "atualiza", "julg", "deferi"))}
              print(r["candidato"], json.dumps(sel, ensure_ascii=False)[:600])
          PY
