# Sonda de rede: o que o Instagram responde do runner do GitHub.
# Não coleta e não grava nada; só imprime o que cada caminho devolve, para a decisão sobre
# automatizar seguidores ser tomada com prova e não de memória.
name: Sonda do Instagram

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Perguntar ao Instagram
        run: python3 coleta/_sonda_instagram.py lula jandirafeghali erikahilton
