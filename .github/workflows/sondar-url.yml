# Diagnóstico: busca URLs a partir do runner e mostra status, tipo e o começo do corpo.
# Serve para testar se uma fonte (TSE, Wikipédia, imprensa) responde ao GitHub. Não grava nada.
name: Sondar URL

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs separadas por espaço'
        required: true
      bytes:
        description: 'Quantos caracteres do corpo mostrar'
        default: '3000'

permissions:
  contents: read

jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar
        env:
          URLS: ${{ inputs.urls }}
          BYTES: ${{ inputs.bytes }}
        run: |
          python3 - <<'PY'
          import os, urllib.request
          n = int(os.environ.get("BYTES") or 3000)
          for u in os.environ["URLS"].split():
              print("=" * 100); print(u, flush=True)
              try:
                  req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 (observatorio-2026)", "Accept": "*/*"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      b = r.read()
                      print("status", r.status, "|", r.headers.get("Content-Type"), "|", len(b), "bytes")
                      print(b[:n].decode("utf-8", "replace"))
              except Exception as e:
                  print("ERRO", repr(e)[:300])
          PY
